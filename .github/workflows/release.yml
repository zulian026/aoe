name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package, Verify, and Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Pin npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@11.21.2

      - name: Verify Node.js, npm, and pnpm versions
        run: |
          echo "=== Release Environment Runtime Inventory ==="
          node -v
          npm -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build

      - name: Verify Clean Installation
        run: ./scripts/verify-clean-install.sh

      - name: Validate publication dry-run
        run: pnpm -r publish --access public --provenance --no-git-checks --dry-run

      - name: Pack release tarballs
        run: |
          mkdir -p release-artifacts
          pnpm -r exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      - name: Generate release checksums
        run: |
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aoe-release-artifacts
          path: release-artifacts/

      - name: Publish to npm (OIDC Trusted Publishing)
        run: pnpm -r publish --access public --provenance --no-git-checks

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
          body_path: CHANGELOG.md
