name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to release (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package, Verify, and Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Resolve and validate target ref
        id: target
        run: |
          TARGET_TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "=== Release Target Resolution ==="
          echo "Target tag: $TARGET_TAG"
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Target tag '$TARGET_TAG' does not match semver format v*.*.*"
            exit 1
          fi

      - name: Checkout repository at target release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_tag }}

      - name: Verify release commit and package consistency
        run: |
          echo "=== Release Target Verification ==="
          RESOLVED_COMMIT=$(git rev-parse HEAD)
          echo "Checked out commit: $RESOLVED_COMMIT"
          if [[ "${{ steps.target.outputs.target_tag }}" == "v0.1.2" ]]; then
            EXPECTED_COMMIT="5e98b3f73067215fa4a223fd86b1be4151e491f9"
            if [[ "$RESOLVED_COMMIT" != "$EXPECTED_COMMIT" ]]; then
              echo "ERROR: v0.1.2 resolved commit mismatch! Expected $EXPECTED_COMMIT, got $RESOLVED_COMMIT"
              exit 1
            fi
            echo "PASS: Checked out commit exactly matches approved v0.1.2 release commit ($EXPECTED_COMMIT)"
          fi
          node -e '
            const fs = require("fs");
            const pkgs = ["protocol", "themes", "core", "components", "adapters", "renderer", "cli"];
            for (const p of pkgs) {
              const dir = p === "cli" ? "apps/cli" : "packages/" + p;
              const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
              if (pkg.version !== "0.1.2") {
                console.error(`ERROR: ${pkg.name} version is ${pkg.version}, expected 0.1.2`);
                process.exit(1);
              }
              console.log(`Verified ${pkg.name}@${pkg.version}`);
            }
          '

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Pin npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@11.21.2

      - name: Verify Node.js, npm, and pnpm versions
        run: |
          echo "=== Release Environment Runtime Inventory ==="
          node -v
          npm -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build monorepo
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify Clean Installation
        run: ./scripts/verify-clean-install.sh

      - name: Pack release tarballs
        run: |
          mkdir -p release-artifacts
          pnpm -r exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      - name: Generate release checksums
        run: |
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aoe-release-artifacts
          path: release-artifacts/

      - name: Validate publication dry-run
        run: |
          echo "=== Validating publication dry-run for all 7 release artifacts ==="
          ORDER=(
            "zyanx04-protocol-0.1.2.tgz"
            "zyanx04-themes-0.1.2.tgz"
            "zyanx04-core-0.1.2.tgz"
            "zyanx04-components-0.1.2.tgz"
            "zyanx04-adapters-0.1.2.tgz"
            "zyanx04-renderer-0.1.2.tgz"
            "zyanx04-cli-0.1.2.tgz"
          )
          for tarball in "${ORDER[@]}"; do
            echo "--> Dry-run publishing $GITHUB_WORKSPACE/release-artifacts/$tarball..."
            npm publish "$GITHUB_WORKSPACE/release-artifacts/$tarball" --access public --dry-run
          done

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          echo "=== Debugging OIDC Token Exchange ==="
          if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]]; then
            echo "Requesting GitHub OIDC Token for audience npm:registry.npmjs.org..."
            TOKEN_RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
            RAW_JWT=$(node -e 'console.log(JSON.parse(process.argv[1]).value || "")' "$TOKEN_RESP")
            if [[ -n "$RAW_JWT" ]]; then
              echo "Decoded GitHub OIDC Claims:"
              node -e '
                const parts = process.argv[1].split(".");
                const payload = JSON.parse(Buffer.from(parts[1], "base64").toString("utf8"));
                console.log(JSON.stringify({
                  repository: payload.repository,
                  repository_owner: payload.repository_owner,
                  job_workflow_ref: payload.job_workflow_ref,
                  ref: payload.ref,
                  ref_type: payload.ref_type,
                  event_name: payload.event_name,
                  environment: payload.environment,
                  aud: payload.aud,
                  iss: payload.iss
                }, null, 2));
              ' "$RAW_JWT"

              echo "Testing OIDC exchange across all 7 packages:"
              PACKAGES=(
                "@zyanx04/protocol"
                "@zyanx04/themes"
                "@zyanx04/core"
                "@zyanx04/components"
                "@zyanx04/adapters"
                "@zyanx04/renderer"
                "@zyanx04/cli"
              )
              for pkg in "${PACKAGES[@]}"; do
                escaped=$(node -e "console.log(encodeURIComponent('$pkg'))")
                resp=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
                  -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$escaped" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $RAW_JWT")
                echo "Package $pkg -> $(echo "$resp" | tr '\n' ' ')"
              done
            else
              echo "ERROR: Failed to obtain JWT from GitHub Actions: $TOKEN_RESP"
            fi
          fi

          echo "=== Publishing Release Tarballs via npm OIDC Trusted Publishing ==="
          ORDER=(
            "zyanx04-protocol-0.1.2.tgz"
            "zyanx04-themes-0.1.2.tgz"
            "zyanx04-core-0.1.2.tgz"
            "zyanx04-components-0.1.2.tgz"
            "zyanx04-adapters-0.1.2.tgz"
            "zyanx04-renderer-0.1.2.tgz"
            "zyanx04-cli-0.1.2.tgz"
          )
          for tarball in "${ORDER[@]}"; do
            echo "--> Publishing $GITHUB_WORKSPACE/release-artifacts/$tarball via npm OIDC..."
            npm publish "$GITHUB_WORKSPACE/release-artifacts/$tarball" --access public --provenance --verbose
            echo "✓ Successfully published $tarball"
            sleep 2
          done

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.target_tag }}
          name: AOE ${{ steps.target.outputs.target_tag }}
          draft: true
          files: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
          body_path: CHANGELOG.md
