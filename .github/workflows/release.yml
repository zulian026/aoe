name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Package and Verify Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Pack release tarballs
        run: |
          mkdir -p release-artifacts
          pnpm -r exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      - name: Generate release checksums
        run: |
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aoe-release-artifacts
          path: release-artifacts/

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
          body_path: CHANGELOG.md
